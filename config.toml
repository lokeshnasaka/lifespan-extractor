# Pipeline settings. The model name lives here, not in code.

[llm]
provider = "anthropic"   # "ollama" (local, free) | "anthropic" (needs ANTHROPIC_API_KEY)
model = "claude-haiku-5-5"  # ollama: any pulled model tag; anthropic: e.g. "claude-opus-5-5"
max_tokens = 16000

# Used only when provider = "anthropic".
effort = "high"        # low | medium | high | xhigh | max

# Used only when provider = "ollama".
ollama_url = "http://localhost:11434"
num_ctx = 32768        # context window in tokens; paper + output must fit or the run fails

[eval]
n_papers = 30
seed = 0
lifespan_tolerance_pct = 2.0   # extracted value within +/- this many points counts as correct
