[project]
name = "lifespan-extractor"
version = "0.1.0"
description = "Extract structured lifespan-experiment data from aging papers and score it against DrugAge"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
